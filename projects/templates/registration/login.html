{% load static %}<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish — Qurilish ERP</title>
  <link rel="stylesheet" href="{% static 'vendor/inter.css' %}">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ink:#32363a; --mut:#6a6d70; --line:#e5e5e5; --brand:#0a6ed1; --bad:#bb0000; }
    body { font-family:"Inter",system-ui,"Segoe UI",sans-serif; background:#f5f6f7; color:var(--ink);
           -webkit-font-smoothing:antialiased; letter-spacing:-.006em;
           min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .box { background:#fff; border:1px solid var(--line); border-radius:16px;
           box-shadow:0 1px 2px rgba(15,23,41,.04), 0 12px 32px -12px rgba(15,23,41,.14);
           padding:34px 32px; width:100%; max-width:390px; }
    .mark { width:46px; height:46px; border-radius:13px; background:var(--brand); display:grid; place-items:center;
            color:#fff; margin-bottom:18px; }
    .mark svg { width:24px; height:24px; }
    .brand { font-size:21px; font-weight:800; letter-spacing:-.02em; color:var(--ink); }
    .sub { color:var(--mut); font-size:14px; margin:3px 0 24px; }
    label { display:block; font-size:12.5px; font-weight:600; color:#374151; margin-bottom:6px; }
    input { width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px; font-size:15px;
            font-family:inherit; margin-bottom:15px; transition:.14s; background:#fff; color:var(--ink); }
    input:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(10,110,209,.18); }
    button { width:100%; background:var(--brand); color:#fff; border:0; border-radius:10px; padding:12px;
             font-size:15px; font-weight:600; font-family:inherit; cursor:pointer; margin-top:4px; transition:.14s; }
    button:hover { background:#0857a8; }
    .err { background:#fef2f2; color:var(--bad); border:1px solid #fecaca; border-radius:10px;
           padding:10px 13px; font-size:13.5px; margin-bottom:16px; font-weight:500; }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg></div>
    <div class="brand">Qurilish ERP</div>
    <div class="sub">Tizimga kirish</div>

    {% if xato %}
      <div class="err">{{ xato }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.GET.next|default:'' }}">
      <label>Foydalanuvchi (login)</label>
      <input type="text" name="username" autofocus required>
      <label>Parol</label>
      <input type="password" name="password" required>
      <button type="submit">Kirish</button>
    </form>
  </div>
</body>
</html>
