{% extends "base_site.html" %}
{% block title %}Yangi material so'rovi — Qurilish ERP{% endblock %}
{% block page_title %}Yangi material so'rovi (PTOga){% endblock %}

{% block extra_head %}
<style>
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; max-width:920px; }
  label.fl { font-size:11.5px; font-weight:600; color:var(--mut); display:block; margin-bottom:6px; }
  select, input, textarea { padding:9px 12px; border:1px solid var(--line); border-radius:9px; font-size:13.5px; background:var(--card); color:var(--ink); font-family:inherit; }
  select:focus, input:focus, textarea:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(51,65,85,.1); }
  .top { display:flex; gap:18px; flex-wrap:wrap; margin-bottom:18px; }
  .top .fgrp { flex:1; min-width:240px; }
  select.obj { width:100%; cursor:pointer; }
  table.m { width:100%; border-collapse:collapse; }
  table.m th { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); font-weight:600; text-align:left; padding:6px 8px; }
  table.m td { padding:5px 8px; }
  table.m input.nm { width:100%; }
  table.m input.un { width:90px; } table.m input.qt { width:110px; }
  table.m input.nt { width:100%; }
  .rowdel { border:none; background:none; color:#dc2626; font-size:18px; cursor:pointer; line-height:1; }
  .btn { font-size:13px; color:#374151; background:var(--card); border:1px solid var(--line); border-radius:9px; padding:9px 15px; font-weight:600; cursor:pointer; text-decoration:none; }
  .btn:hover { background:#f9fafb; }
  .btn.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
  .acts { display:flex; gap:10px; margin-top:18px; align-items:center; }
</style>
{% endblock %}

{% block content %}
<form method="post" class="card">
  {% csrf_token %}
  <div class="top">
    <div class="fgrp">
      <label class="fl">Obyekt (faqat sizga biriktirilgan)</label>
      <select name="project" class="obj" required>
        <option value="">— tanlang —</option>
        {% for p in obyektlar %}<option value="{{ p.id }}">{{ p.code }} — {{ p.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="fgrp">
      <label class="fl">Umumiy izoh (ixtiyoriy)</label>
      <input type="text" name="note_umumiy" placeholder="masalan: shoshilinch">
    </div>
  </div>

  <table class="m">
    <thead><tr><th style="width:44%">Material nomi</th><th>Birlik</th><th>Miqdor</th><th>Izoh</th><th></th></tr></thead>
    <tbody id="rows">
      <tr>
        <td><input class="nm" name="name" placeholder="Sement M400"></td>
        <td><input class="un" name="unit" placeholder="qop"></td>
        <td><input class="qt" name="quantity" inputmode="decimal" placeholder="0"></td>
        <td><input class="nt" name="note"></td>
        <td><button type="button" class="rowdel" title="O'chirish">×</button></td>
      </tr>
    </tbody>
  </table>

  <div class="acts">
    <button type="button" class="btn" id="addrow">+ Qator qo'shish</button>
    <button type="submit" class="btn primary">PTOga yuborish</button>
    <a class="btn" href="{% url 'material_sorov' %}">Bekor</a>
  </div>
</form>

<script>
(function(){
  var tb = document.getElementById("rows");
  function bind(btn){ btn.addEventListener("click", function(){
    if (tb.rows.length > 1) btn.closest("tr").remove();
    else { btn.closest("tr").querySelectorAll("input").forEach(function(i){ i.value=""; }); }
  }); }
  tb.querySelectorAll(".rowdel").forEach(bind);
  document.getElementById("addrow").addEventListener("click", function(){
    var tr = tb.rows[0].cloneNode(true);
    tr.querySelectorAll("input").forEach(function(i){ i.value=""; });
    bind(tr.querySelector(".rowdel"));
    tb.appendChild(tr);
  });
})();
</script>
{% endblock %}
